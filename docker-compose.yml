services:
  # Servicio de Base de Datos
  db:
    image: postgres:15-alpine
    container_name: mikedb_container7
    restart: always
    environment:
      POSTGRES_USER: mike3
      POSTGRES_PASSWORD: super_secret_password4
      POSTGRES_DB: mikedb3
    ports:
      - "5436:5432"
    volumes:
      - postgres_data3:/var/lib/postgresql/data
    networks:
      - clasea_network

  # Servicio de Almacenamiento MinIO
  minio:
    image: chainguard/minio:latest
    container_name: minio_storage
    user: "65532:65532"
    ports:
      - "9000:9000"   # Puerto API S3
      - "9001:9001"   # Puerto Consola Web
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: passwordseguro123
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - clasea_network

  # Inicializador para crear el bucket 'tickets' y hacerlo PÚBLICO automáticamente
# Inicializador para crear los buckets y hacerlos PÚBLICOS automáticamente
  createbuckets:
    image: alpine:latest
    container_name: minio_mc_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl;
      curl -O https://dl.min.io/client/mc/release/linux-amd64/mc;
      chmod +x mc;
      until ./mc alias set myminio http://minio:9000 admin passwordseguro123; do echo 'Esperando a MinIO...'; sleep 1; done;
      ./mc mb myminio/tickets --ignore-existing;
      ./mc anonymous set download myminio/tickets;
      ./mc mb myminio/fastapi-images --ignore-existing;
      ./mc anonymous set download myminio/fastapi-images;
      echo '¡Buckets tickets y fastapi-images configurados como PÚBLICOS!';
      exit 0;
      "
    networks:
      - clasea_network

# Definición de volúmenes
volumes:
  postgres_data3:
  db_data:
    driver: local

# Definición de redes
networks:
  clasea_network:
    driver: bridge